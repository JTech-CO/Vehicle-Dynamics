<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Dynamics 3DOF Sim</title>
    
    <!-- React & DOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* --- RETRO CAD UI STYLE --- */
        :root {
            --bg-color: #050505; 
            --panel-bg: #001a2d;
            --text-main: #c0d0e0;
            --text-highlight: #00ffff;
            --text-warn: #ffcc00;
            --text-error: #ff3333;
            --border-light: #405060;
            --font-stack: "Courier New", Courier, monospace;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- UI COMPONENTS --- */

        /* 1. Menu Bar */
        #menubar {
            background: #a0a0a0;
            color: #000;
            padding: 4px 10px;
            border-bottom: 2px solid #fff;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between; /* 양끝 정렬 */
            align-items: center;
            height: 30px;
            flex-shrink: 0;
            z-index: 100;
            user-select: none;
        }

        /* Guide Notification Box in Header */
        .guide-box {
            background: #000080; /* Navy Blue */
            color: #fff;
            padding: 2px 10px;
            border: 1px solid #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 400px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }
        .guide-icon { color: #ffff00; animation: blink 2s infinite; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* 2. Main Workspace (Split Layout) */
        #workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 55px); /* Menu(30) + Status(25) */
        }

        /* --- LEFT PANEL: CONTROLS --- */
        #control-panel {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 2px solid var(--border-light);
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto; /* Scrollable */
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .panel-section {
            border: 1px solid var(--border-light);
            margin-bottom: 25px;
            padding: 20px 10px 10px 10px;
            position: relative;
            background: rgba(0,0,0,0.2);
        }

        .panel-header {
            position: absolute;
            top: -10px;
            left: 10px;
            background: var(--panel-bg);
            padding: 0 5px;
            color: var(--text-highlight);
            font-weight: bold;
            border: 1px solid var(--panel-bg);
            font-size: 12px;
        }

        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        label { color: #aaa; font-weight: bold; font-size: 11px;}

        input[type="number"] {
            background: #000;
            color: var(--text-highlight);
            border: 1px solid var(--border-light);
            padding: 4px 5px;
            font-family: var(--font-stack);
            width: 90px;
            text-align: right;
            font-size: 12px;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: var(--text-highlight);
            background: #001020;
        }

        button.run-btn {
            width: 100%;
            background: #003040;
            color: #fff;
            border: 1px solid #506070;
            padding: 12px;
            font-family: var(--font-stack);
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 14px;
            box-shadow: 2px 2px 0px #000;
        }
        button.run-btn:hover { background: #005070; border-color: var(--text-highlight); color: var(--text-highlight); }
        button.run-btn:active { background: #002030; transform: translate(1px, 1px); box-shadow: none; }

        /* --- RIGHT PANEL: VISUALIZATION --- */
        #vis-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-color);
        }

        /* Top: Trajectory Canvas */
        #canvas-wrapper {
            flex: 2; /* Takes up 2/3 space roughly */
            background: radial-gradient(circle at center, #001525 0%, #000000 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--border-light);
            min-height: 200px;
        }

        .viewport-label {
            position: absolute;
            top: 10px;
            left: 10px;
            color: var(--text-highlight);
            font-size: 12px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border: 1px solid var(--border-light);
        }

        /* Bottom: Charts */
        #charts-wrapper {
            flex: 1; /* Takes up 1/3 space */
            background: #000810;
            display: flex;
            gap: 1px; /* Divider line via gap */
            background-color: var(--border-light); /* Line color */
            min-height: 200px;
            max-height: 300px;
        }

        .chart-box {
            flex: 1;
            background: #000810;
            position: relative;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .chart-title {
            color: var(--text-main);
            font-size: 11px;
            margin-bottom: 5px;
            text-align: center;
            border-bottom: 1px solid #203040;
            padding-bottom: 4px;
        }

        .chart-canvas-container {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        /* Log Area (Bottom of Left Panel) */
        #log-area {
            border: 1px inset var(--border-light);
            background: #000;
            height: 150px;
            overflow-y: auto;
            padding: 8px;
            font-size: 10px;
            color: #0f0;
            font-family: monospace;
            margin-top: auto;
        }
        .log-entry { margin-bottom: 2px; line-height: 1.2; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #405060; border: 1px solid #000; }
        ::-webkit-scrollbar-corner { background: #000; }

        /* 3. Status Bar */
        #statusbar {
            background: #a0a0a0;
            border-top: 2px solid #fff;
            color: #000;
            padding: 0 10px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 25px;
            flex-shrink: 0;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            // --- 1. 상태 변수 ---
            const [params, setParams] = useState({
                m: 1500,      Iz: 2500,
                lf: 1.2,      lr: 1.6,
                Cf: 120000,   Cr: 110000,
                vx_kph: 80,   steerAngleDeg: 2,
                steerStartTime: 1
            });

            const [simData, setSimData] = useState(null);
            const [logs, setLogs] = useState(["System Initialized.", "Ready for input."]);
            const [guideIndex, setGuideIndex] = useState(0);
            
            // 해석 가이드 메시지 목록
            const guideMessages = [
                "TIP 1: Yaw Rate가 부드럽게 수렴하면 안정적인 코너링 상태입니다.",
                "TIP 2: Lateral Velocity가 과도하면 타이어 미끄러짐(Drift)이 발생한 것입니다.",
                "TIP 3: 후륜 강성(Cr)을 전륜(Cf)보다 낮추면 Oversteer(안쪽 말림)가 발생합니다.",
                "TIP 4: 속도(SPEED)를 150km/h 이상으로 높여 고속 불안정성을 테스트해보세요.",
                "TIP 5: 그래프의 노란 선(Lateral Vel)은 차체의 미끄러짐 속도를 나타냅니다."
            ];

            // 가이드 메시지 자동 순환 (3초 간격)
            useEffect(() => {
                const timer = setInterval(() => {
                    setGuideIndex(prev => (prev + 1) % guideMessages.length);
                }, 4000);
                return () => clearInterval(timer);
            }, []);
            
            // Refs
            const yawChartRef = useRef(null);
            const latVelChartRef = useRef(null);
            const chartInstanceYaw = useRef(null);
            const chartInstanceLatVel = useRef(null);
            const canvasRef = useRef(null);
            const canvasWrapperRef = useRef(null);

            const addLog = (msg) => {
                const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "2-digit", minute:"2-digit", second:"2-digit" });
                setLogs(prev => [`[${time}] ${msg}`, ...prev].slice(0, 100));
            };

            // --- 2. 시뮬레이션 로직 ---
            const runSimulation = () => {
                addLog(`Executing Sim: v=${params.vx_kph}kph, ang=${params.steerAngleDeg}deg`);
                
                const dt = 0.01, T_end = 5;
                const steps = Math.floor(T_end / dt);

                let vy = 0, r = 0, psi = 0, X = 0, Y = 0;
                
                const vx = params.vx_kph / 3.6;
                const steerAmp = params.steerAngleDeg * (Math.PI / 180);

                const results = { time: [], yawRate: [], latVel: [], pathX: [], pathY: [] };

                for (let i = 0; i < steps; i++) {
                    const t = i * dt;
                    let delta_f = (t >= params.steerStartTime) ? steerAmp : 0;

                    // Dynamics
                    const alpha_f = delta_f - (vy + params.lf * r) / vx;
                    const alpha_r = - (vy - params.lr * r) / vx;
                    const Fyf = params.Cf * alpha_f;
                    const Fyr = params.Cr * alpha_r;

                    const vy_dot = (Fyf + Fyr) / params.m - vx * r;
                    const r_dot = (params.lf * Fyf - params.lr * Fyr) / params.Iz;

                    vy += vy_dot * dt;
                    r += r_dot * dt;
                    psi += r * dt;

                    X += (vx * Math.cos(psi) - vy * Math.sin(psi)) * dt;
                    Y += (vx * Math.sin(psi) + vy * Math.cos(psi)) * dt;

                    if (i % 5 === 0) { // Downsample for performance if needed
                        results.time.push(t.toFixed(2));
                        results.yawRate.push(r);
                        results.latVel.push(vy);
                        results.pathX.push(X);
                        results.pathY.push(Y);
                    }
                }
                setSimData(results);
            };

            // --- 3. 차트 (Chart.js) ---
            useEffect(() => {
                if (!simData) return;

                const commonOptions = {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 0 },
                    scales: {
                        x: { 
                            display: true, 
                            grid: { color: '#203040', drawBorder: false },
                            ticks: { color: '#607080', font: { family: 'Courier New', size: 10 }, maxRotation: 0 } 
                        },
                        y: { 
                            display: true,
                            grid: { color: '#203040', drawBorder: false },
                            ticks: { color: '#607080', font: { family: 'Courier New', size: 10 } } 
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { 
                            enabled: true, 
                            backgroundColor: 'rgba(0,20,40,0.9)', 
                            titleColor: '#00ffff', 
                            bodyColor: '#c0d0e0',
                            borderColor: '#405060',
                            borderWidth: 1,
                            cornerRadius: 0,
                            displayColors: false
                        }
                    },
                    elements: {
                        line: { borderWidth: 1.5, tension: 0.4 },
                        point: { radius: 0, hitRadius: 10 }
                    }
                };

                // Yaw Rate
                if (chartInstanceYaw.current) chartInstanceYaw.current.destroy();
                chartInstanceYaw.current = new Chart(yawChartRef.current, {
                    type: 'line',
                    data: {
                        labels: simData.time,
                        datasets: [{ data: simData.yawRate, borderColor: '#00ffff', backgroundColor: 'rgba(0,255,255,0.1)', fill: true }]
                    },
                    options: commonOptions
                });

                // Lateral Velocity
                if (chartInstanceLatVel.current) chartInstanceLatVel.current.destroy();
                chartInstanceLatVel.current = new Chart(latVelChartRef.current, {
                    type: 'line',
                    data: {
                        labels: simData.time,
                        datasets: [{ data: simData.latVel, borderColor: '#ffcc00', backgroundColor: 'rgba(255,204,0,0.1)', fill: true }]
                    },
                    options: commonOptions
                });

                drawTrajectory();
            }, [simData]);

            // --- 4. 캔버스 (Trajectory) ---
            const drawTrajectory = () => {
                if(!simData || !canvasRef.current || !canvasWrapperRef.current) return;
                
                const canvas = canvasRef.current;
                const wrapper = canvasWrapperRef.current;
                
                // Resize handling
                canvas.width = wrapper.clientWidth;
                canvas.height = wrapper.clientHeight;
                
                const ctx = canvas.getContext('2d');
                const w = canvas.width;
                const h = canvas.height;

                ctx.clearRect(0, 0, w, h);

                // Grid
                ctx.strokeStyle = '#002030';
                ctx.lineWidth = 1;
                ctx.beginPath();
                const gridSize = 50;
                for(let x=0; x<w; x+=gridSize) { ctx.moveTo(x,0); ctx.lineTo(x,h); }
                for(let y=0; y<h; y+=gridSize) { ctx.moveTo(0,y); ctx.lineTo(w,y); }
                ctx.stroke();

                // Axis
                const pad = 40;
                const pathX = simData.pathX;
                const pathY = simData.pathY;
                
                // Auto-scale
                const minX = Math.min(...pathX), maxX = Math.max(...pathX);
                const minY = Math.min(...pathY), maxY = Math.max(...pathY);
                const rangeX = maxX - minX || 1;
                const rangeY = maxY - minY || 1;
                
                const scale = Math.min((w - pad*2)/rangeX, (h - pad*2)/rangeY);
                const tx = (val) => pad + (val - minX) * scale;
                const ty = (val) => h - pad - (val - minY) * scale; // Invert Y

                // Path
                ctx.beginPath();
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 10;
                
                ctx.moveTo(tx(pathX[0]), ty(pathY[0]));
                for(let i=1; i<pathX.length; i++) ctx.lineTo(tx(pathX[i]), ty(pathY[i]));
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Markers
                ctx.fillStyle = '#00ff00'; // Start
                ctx.fillRect(tx(pathX[0])-3, ty(pathY[0])-3, 6, 6);
                
                ctx.fillStyle = '#ff3333'; // End
                ctx.beginPath();
                ctx.arc(tx(pathX[pathX.length-1]), ty(pathY[pathY.length-1]), 4, 0, Math.PI*2);
                ctx.fill();

                // Text Info
                ctx.fillStyle = '#c0d0e0';
                ctx.font = '10px Courier New';
                ctx.fillText(`X: ${results_last(pathX).toFixed(2)}m`, w-100, h-20);
                ctx.fillText(`Y: ${results_last(pathY).toFixed(2)}m`, w-100, h-35);
            };

            const results_last = (arr) => arr[arr.length-1];

            // Resize Observer
            useEffect(() => {
                const handleResize = () => { if(simData) drawTrajectory(); };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, [simData]);

            useEffect(() => { runSimulation(); }, []);

            const handleChange = (e) => {
                setParams({ ...params, [e.target.name]: parseFloat(e.target.value) });
            };

            return (
                <>
                    <div id="menubar">
                        <span style={{color: '#000080', marginRight:'20px'}}>Vehicle Dynamics 3DOF</span>
                        
                        {/* Guide Notification Area */}
                        <div className="guide-box">
                            <span className="guide-icon">💡</span>
                            <span>{guideMessages[guideIndex]}</span>
                        </div>
                    </div>

                    <div id="workspace">
                        {/* LEFT: Controls */}
                        <div id="control-panel">
                            <div className="panel-section">
                                <div className="panel-header">INPUTS (DRIVER)</div>
                                <div className="input-group">
                                    <label>SPEED (km/h)</label>
                                    <input type="number" name="vx_kph" value={params.vx_kph} onChange={handleChange} />
                                </div>
                                <div className="input-group">
                                    <label>STEER (deg)</label>
                                    <input type="number" name="steerAngleDeg" value={params.steerAngleDeg} onChange={handleChange} />
                                </div>
                                <div className="input-group">
                                    <label>START (sec)</label>
                                    <input type="number" name="steerStartTime" value={params.steerStartTime} onChange={handleChange} step="0.1" />
                                </div>
                                <button className="run-btn" onClick={runSimulation}>RUN SIMULATION</button>
                            </div>

                            <div className="panel-section">
                                <div className="panel-header">VEHICLE PARAMS</div>
                                <div className="input-group">
                                    <label>MASS (kg)</label>
                                    <input type="number" name="m" value={params.m} onChange={handleChange} />
                                </div>
                                <div className="input-group">
                                    <label>I_z (kg·m²)</label>
                                    <input type="number" name="Iz" value={params.Iz} onChange={handleChange} />
                                </div>
                                <div className="input-group">
                                    <label>L_Front (m)</label>
                                    <input type="number" name="lf" value={params.lf} onChange={handleChange} step="0.1" />
                                </div>
                                <div className="input-group">
                                    <label>L_Rear (m)</label>
                                    <input type="number" name="lr" value={params.lr} onChange={handleChange} step="0.1" />
                                </div>
                            </div>

                            <div className="panel-section">
                                <div className="panel-header">TIRE (LINEAR)</div>
                                <div className="input-group">
                                    <label>C_Front (N/rad)</label>
                                    <input type="number" name="Cf" value={params.Cf} onChange={handleChange} />
                                </div>
                                <div className="input-group">
                                    <label>C_Rear (N/rad)</label>
                                    <input type="number" name="Cr" value={params.Cr} onChange={handleChange} />
                                </div>
                            </div>

                            <div id="log-area">
                                {logs.map((l,i) => <div key={i} className="log-entry">&gt; {l}</div>)}
                            </div>
                        </div>

                        {/* RIGHT: Visualization */}
                        <div id="vis-panel">
                            {/* Top Canvas */}
                            <div id="canvas-wrapper" ref={canvasWrapperRef}>
                                <div className="viewport-label">TOP VIEW [TRAJECTORY]</div>
                                <canvas ref={canvasRef}></canvas>
                            </div>

                            {/* Bottom Charts */}
                            <div id="charts-wrapper">
                                <div className="chart-box">
                                    <div className="chart-title">YAW RATE (r) [rad/s]</div>
                                    <div className="chart-canvas-container">
                                        <canvas ref={yawChartRef}></canvas>
                                    </div>
                                </div>
                                <div className="chart-box">
                                    <div className="chart-title">LATERAL VEL (vy) [m/s]</div>
                                    <div className="chart-canvas-container">
                                        <canvas ref={latVelChartRef}></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="statusbar">
                        <span>STATUS: {simData ? "COMPLETED" : "IDLE"}</span>
                        <span>MODE: KINEMATIC</span>
                        <span>COORD: GLOBAL-XY</span>
                    </div>
                </>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
